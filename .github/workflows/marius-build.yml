name: Fork build

# Builds the macOS app on GitHub's Apple Silicon runners, so no laptop has to.
# A `marius-v*` tag attaches the app to its release; a push to `build/**`
# keeps it as a run artifact to try a version before releasing it.
# marius/install-from-ci.sh downloads either and installs it.
on:
  push:
    tags: ["marius-v*"]
    branches: ["build/**"]

concurrency:
  group: marius-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The build stamp reads tags and origin/marius/main.
          fetch-depth: 0

      - name: Fetch marius/main
        run: git fetch origin marius/main:refs/remotes/origin/marius/main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Same as upstream's desktop build: scripts off, then the desktop's
      # native modules on their own.
      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Build
        env:
          NODE_ENV: production
          FORK_BRANCH: ${{ github.ref_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          FORK_BUILD=$(marius/build-stamp.sh)
          export FORK_BUILD
          echo "$FORK_BUILD"
          cd apps/desktop
          bun run prebuild
          bunx electron-builder --config electron-builder.ts --mac dir --arm64 \
            --publish never -c.mac.notarize=false -c.mac.identity=-
          codesign --verify --deep --strict release/mac-arm64/Superset.app

      - name: Zip the app
        id: zip
        run: |
          name="Superset-${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD).zip"
          ditto -c -k --keepParent apps/desktop/release/mac-arm64/Superset.app "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Keep as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: superset-app
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.name }}" --clobber
