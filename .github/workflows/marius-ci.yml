name: Fork CI

# The fork's own gate: upstream's workflows stay disabled here, they need
# Superset's secrets and paid runners. Covers what the fork changes (desktop
# and host-service) on GitHub's free runners.
on:
  # Every PR, so stacked PRs (based on another feature branch) are checked too.
  pull_request:
  push:
    # build/** too: a test build gets checked while GitHub builds it.
    branches: ["marius/main", "build/**"]

concurrency:
  group: marius-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Lint
        run: bun run lint

      - name: Check i18n catalogs
        run: bun run check:i18n && git diff --exit-code --stat HEAD -- packages/i18n/locales

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Typecheck
        run: bun x turbo typecheck --filter=@superset/desktop --filter=@superset/host-service

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      # Same workaround as upstream's CI: bun 1.4.2 can spin forever in a
      # synchronous spawn (oven-sh/bun#44581).
      - name: Use a bun build with the spawnSync fix
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/bun-canary" bun@1.4.2-canary.20261007.1
          echo "$RUNNER_TEMP/bun-canary/node_modules/.bin" >> "$GITHUB_PATH"

      # Through turbo, like upstream: the tests import the compiled i18n
      # catalogs, which turbo builds first.
      - name: Test
        run: timeout --kill-after=15 900 bun x turbo test --filter=@superset/desktop --filter=@superset/host-service --concurrency=2 --log-order=stream
